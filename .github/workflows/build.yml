name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create Android platform
        run: |
          flutter create --platforms=android --org org.test temp_scaffold
          cp -r temp_scaffold/android .
          rm -rf temp_scaffold

      - name: Set application name
        run: |
          sed -i 's/android:label="temp_scaffold"/android:label="This Linux"/' \
          android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin version
        run: |
          sed -i -E \
          "s/(id[[:space:]]*['\"]org\.jetbrains\.kotlin\.android['\"][[:space:]]*version[[:space:]]*['\"])[^'\"]+(['\"])/\11.9.24\2/" \
          android/settings.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ThisLinux Latest
          body: |
            ThisLinux güncel sürüm.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          overwrite_files: true
