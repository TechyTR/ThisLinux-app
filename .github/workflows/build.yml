name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Backup custom Android files
        run: |
          mkdir -p /tmp/thislinux_backup

          cp android/app/src/main/kotlin/org/test/thislinux/MainActivity.kt \
            /tmp/thislinux_backup/MainActivity.kt

          cp android/app/src/main/res/xml/file_paths.xml \
            /tmp/thislinux_backup/file_paths.xml

          cp android/app/src/main/res/values/styles.xml \
            /tmp/thislinux_backup/styles.xml

      - name: Recreate Android platform
        run: |
          rm -rf android
          flutter create --platforms=android --project-name thislinux .

      - name: Restore custom Android files
        run: |
          mkdir -p android/app/src/main/kotlin/org/test/thislinux
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          cp /tmp/thislinux_backup/MainActivity.kt \
            android/app/src/main/kotlin/org/test/thislinux/MainActivity.kt

          cp /tmp/thislinux_backup/file_paths.xml \
            android/app/src/main/res/xml/file_paths.xml

          cp /tmp/thislinux_backup/styles.xml \
            android/app/src/main/res/values/styles.xml

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          if "REQUEST_INSTALL_PACKAGES" not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.REQUEST_INSTALL_PACKAGES" />''',
                  1
              )

          if "androidx.core.content.FileProvider" not in text:
              provider = '''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">

                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />

                  </provider>
              '''

              text = text.replace(
                  "</application>",
                  provider + "\n        </application>",
                  1
              )

          if 'android:name="flutterEmbedding"' not in text:
              text = text.replace(
                  "</application>",
                  '''<meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  </application>''',
                  1
              )

          path.write_text(text)
          PY

      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = text.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 23"
          )

          if "minSdk = 23" not in text:
              text = text.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        minSdk = 23",
                  1
              )

          path.write_text(text)
          PY

      - name: Create Flutter local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Verify Android embedding
        run: |
          echo "=== Android Manifest ==="
          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "=== Checking for Android V1 embedding ==="

          if grep -RniE \
            'io\.flutter\.app\.|flutterEmbedding.*1|io\.flutter\.view\.' \
            android/app/src/main; then

            echo ""
            echo "ERROR: Android V1 embedding reference detected."
            exit 1
          fi

          echo ""
          echo "Android V2 embedding check passed."

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: v2.3.0
          body: |
            ThisLinux güncel sürüm.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          overwrite_files: true

