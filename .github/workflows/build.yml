name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Create Flutter local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Verify Android configuration
        run: |
          echo "=== Android settings.gradle ==="
          cat android/settings.gradle

          echo ""
          echo "=== Android app/build.gradle ==="
          cat android/app/build.gradle

          echo ""
          echo "=== Android Manifest ==="
          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "=== Android embedding check ==="

          if grep -RniE \
            'io\.flutter\.app\.|io\.flutter\.view\.|flutterEmbedding.*1' \
            android/app/src/main; then

            echo "ERROR: Android V1 embedding detected."
            exit 1
          fi

          echo "Android V2 embedding confirmed."

      - name: Generate app icon
        run: |
          dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: v2.3.0
          body: |
            ThisLinux güncel sürüm.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          overwrite_files: true

