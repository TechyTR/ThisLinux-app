name: thislinux
description: "ThisLinux system utility application."
publish_to: 'none'

version: 2.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.2
  http: ^1.2.2
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/linux_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
